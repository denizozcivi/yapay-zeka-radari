<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>{{FONTLAR}}</style>
<style>
  :root {
    --bg: #0A1220;
    --panel: #0F1A2C;
    --panel-line: #1F2F4A;
    --ink: #F2F5FA;
    --text: #C6CFDD;
    --muted: #8391A7;
    --red: #FF4F4F;
    --red-soft: rgba(255, 79, 79, 0.10);
    --blue: #4EA1FF;
    --green: #3DDC97;
    --code-bg: #08111E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: radial-gradient(1200px 700px at 85% -10%, #13243F 0%, transparent 60%), var(--bg);
    color: var(--text);
    font-family: "Inter", sans-serif;
    display: flex; flex-direction: column;
    padding: 40px 44px 0;
  }
  .k { color: var(--red); font-weight: 700; }
  .m { color: var(--blue); }
  .g { color: var(--green); }
  .y { color: var(--muted); }
  em { font-style: normal; font-weight: 500; color: var(--muted); }

  /* ---- üst kısım ---- */
  .ust { display: flex; justify-content: space-between; align-items: baseline;
         font-family: "JetBrains Mono", monospace; font-size: 19px; color: var(--muted); }
  .ust b { color: var(--ink); letter-spacing: 1px; text-transform: uppercase; }
  .baslik { display: flex; gap: 24px; align-items: center; margin-top: 22px; }
  .baslik-ikon { flex: none; width: 92px; height: 92px; border-radius: 18px; display: grid; place-items: center;
                 background: var(--red-soft); border: 2px solid rgba(255, 79, 79, 0.55); color: var(--ink); }
  .baslik-ikon .ik { width: 54px; height: 54px; }
  h1 { font-size: 50px; line-height: 1.08; font-weight: 800; letter-spacing: -0.6px; color: var(--ink); text-wrap: balance; }
  h1 .hl { color: var(--red); }
  .alt { margin-top: 8px; font-size: 24px; line-height: 1.3; color: var(--text); }

  /* ---- pano: gorsel_html buraya girer ---- */
  .pano { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px;
          padding: 24px 0 20px; }
  .sira { display: grid; gap: 14px; }
  .sira.uc { grid-template-columns: 1fr 1fr 1fr; }
  .sira.iki { grid-template-columns: 1fr 1fr; }
  .sira > * { min-width: 0; }

  .panel { background: var(--panel); border: 1.5px solid var(--panel-line); border-radius: 12px; padding: 18px 20px; }
  .panel h3 { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; color: var(--ink);
              margin-bottom: 12px; }
  .panel h3.g { color: var(--green); }
  .panel h3 .ik { width: 28px; height: 28px; }
  .panel p { font-size: 19px; line-height: 1.42; }
  .panel p + p, .panel p + pre, .panel pre + p { margin-top: 10px; }
  .panel .etk { font-size: 16px; font-weight: 700; color: var(--blue); margin: 12px 0 6px; }
  .panel p.aciklama { font-size: 16px; color: var(--muted); }

  /* künye: ikon + mavi etiket + değer */
  .kunye { list-style: none; display: flex; flex-direction: column; gap: 14px; }
  .kunye li { position: relative; padding-left: 46px; font-size: 18px; line-height: 1.35; }
  .kunye li > .ik { position: absolute; left: 0; top: 4px; width: 32px; height: 32px; }
  .kunye li > b { display: block; font-size: 17px; color: var(--blue); }

  /* numaralı adımlar */
  .adimlar { list-style: none; counter-reset: adim; display: flex; flex-direction: column; gap: 12px; }
  .adimlar li { counter-increment: adim; position: relative; padding-left: 42px; font-size: 18px; line-height: 1.38; }
  .adimlar li::before { content: counter(adim); position: absolute; left: 0; top: 0; width: 28px; height: 28px;
         border-radius: 50%; background: var(--blue); color: #fff; font-size: 16px; font-weight: 800;
         display: grid; place-items: center; }

  /* akış şeridi */
  .akis { display: flex; align-items: center; gap: 6px; padding: 18px 22px; }
  .dugum { flex: none; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px;
           max-width: 190px; }
  .dugum > .ik { width: 64px; height: 64px; margin-bottom: 6px; }
  .dugum b { font-size: 17px; font-weight: 700; color: var(--ink); }
  .dugum span { font-size: 14px; color: var(--muted); }
  .dugum.mekanizma { border: 2px dashed #36588A; border-radius: 10px; padding: 10px 14px 8px; gap: 6px; }
  .dugum.mekanizma b { color: var(--blue); font-size: 15px; }
  .dugum code { font-family: "JetBrains Mono", monospace; font-size: 16px; font-weight: 700; color: #FF8A80;
                background: var(--red-soft); border: 1.5px solid rgba(255, 79, 79, 0.6); border-radius: 6px;
                padding: 4px 10px; white-space: nowrap; }
  .ok { flex: 1; min-width: 70px; position: relative; text-align: center; font-size: 14px; line-height: 1.25;
        color: var(--text); padding: 0 4px 16px; }
  .ok::after { content: ""; position: absolute; left: 4px; right: 12px; bottom: 0; height: 2.5px; background: var(--red); }
  .ok::before { content: ""; position: absolute; right: 2px; bottom: -5px;
                border-left: 12px solid var(--red); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }

  /* kod kutusu */
  .panel pre { font-family: "JetBrains Mono", monospace; font-size: 15px; line-height: 1.55; color: #D9E1EE;
               background: var(--code-bg); border: 1px solid var(--panel-line); border-radius: 8px;
               padding: 10px 14px; white-space: pre; overflow: hidden; }
  .uyari-kutu { position: relative; margin-top: 12px; padding: 10px 14px 10px 50px; font-size: 15px; line-height: 1.35;
                color: #FFB4AE; background: var(--red-soft); border: 1.5px solid rgba(255, 79, 79, 0.6); border-radius: 8px; }
  .uyari-kutu > .ik { position: absolute; left: 14px; top: 50%; margin-top: -13px; width: 26px; height: 26px; color: var(--red); }

  /* kontrol listesi */
  .kontrol { list-style: none; columns: 2; column-gap: 28px; }
  .kontrol li { position: relative; padding-left: 34px; font-size: 18px; line-height: 1.38; margin-bottom: 8px;
                break-inside: avoid; }
  .kontrol li::before { content: ""; position: absolute; left: 0; top: 2px; width: 22px; height: 22px;
                        background: var(--green); -webkit-mask: var(--i-tik) center / contain no-repeat;
                        mask: var(--i-tik) center / contain no-repeat; }
  .kontrol.tek { columns: 1; }

  /* ortalanmış tek satır, iki yanında çizgi (satır içi, <b> ve .k serbest) */
  .slogan { overflow: hidden; text-align: center; font-size: 22px; color: var(--text); white-space: nowrap; }
  .slogan::before, .slogan::after { content: ""; display: inline-block; position: relative; width: 50%; height: 1.5px;
                                    vertical-align: middle; background: var(--panel-line); }
  .slogan::before { right: 22px; margin-left: -50%; }
  .slogan::after { left: 22px; margin-right: -50%; }
  .slogan b { color: var(--ink); }

  /* ---- ikonlar: <i class="ik i-ad"></i>, renk için k / m / g ---- */
  .ik { display: inline-block; flex: none; width: 28px; height: 28px; background: currentColor;
        -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }

  }
